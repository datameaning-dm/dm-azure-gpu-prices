name: Weekly refresh

# Every Monday: ask Microsoft's Retail Prices API again, run every check, and commit the new prices only
# if all of them pass. Then mirror the same files to Hugging Face and Kaggle, each only when its token is
# set as a repository secret (HF_TOKEN; KAGGLE_USERNAME and KAGGLE_API_TOKEN), so a missing token skips that
# mirror instead of failing the refresh.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_REPO: datameaning/azure-gpu-vm-prices
      KAGGLE_SLUG: azure-gpu-vm-prices
      HAS_HF: ${{ secrets.HF_TOKEN != '' }}
      HAS_KAGGLE: ${{ secrets.KAGGLE_API_TOKEN != '' && secrets.KAGGLE_USERNAME != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fetch and check
        shell: bash
        run: |
          cp data/azure_gpu_vm_prices.csv "$RUNNER_TEMP/previous.csv"
          python3 azure_gpu_prices.py --snapshot-out data/raw/azure_retail_prices_n_series.csv --out data \
            --previous "$RUNNER_TEMP/previous.csv" | tee data/run-output.txt

      - name: Commit
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "Prices fetched $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Mirror to Hugging Face
        if: steps.commit.outputs.changed == 'true' && env.HAS_HF == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          pip install -q "huggingface_hub==0.26.2"
          python3 - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(os.environ["HF_REPO"], repo_type="dataset", exist_ok=True)
          for path in ["README.md", "gpu_specs.csv", "azure_gpu_prices.py", "data/azure_gpu_vm_prices.csv",
                       "data/azure_gpu_vm_summary.csv", "data/run-output.txt"]:
              api.upload_file(path_or_fileobj=path, path_in_repo=path, repo_id=os.environ["HF_REPO"],
                              repo_type="dataset", commit_message="Weekly refresh")
          EOF

      - name: Mirror to Kaggle
        if: steps.commit.outputs.changed == 'true' && env.HAS_KAGGLE == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}   # Kaggle's newer API token; needs kaggle>=1.8
        shell: bash
        run: |
          pip install -q "kaggle==1.8.4"
          mkdir -p "$RUNNER_TEMP/kaggle"
          cp gpu_specs.csv data/azure_gpu_vm_prices.csv data/azure_gpu_vm_summary.csv "$RUNNER_TEMP/kaggle/"
          sed "s/KAGGLE_USERNAME/$KAGGLE_USERNAME/" kaggle/dataset-metadata.json > "$RUNNER_TEMP/kaggle/dataset-metadata.json"
          if kaggle datasets status "$KAGGLE_USERNAME/$KAGGLE_SLUG" >/dev/null 2>&1; then
            kaggle datasets version -p "$RUNNER_TEMP/kaggle" -m "Prices fetched $(date -u +%Y-%m-%d)"
          else
            kaggle datasets create -p "$RUNNER_TEMP/kaggle" --public
          fi
